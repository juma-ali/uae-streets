<!doctype html>
<html lang="en" dir="ltr"
      data-title-en="Search streets — United Arab Emirates"
      data-title-ar="بحث الشوارع — الإمارات العربية المتحدة">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search streets — United Arab Emirates</title>
<script>try{var p=new URLSearchParams(location.search).get("lang");var s=null;try{s=localStorage.getItem("directory-lang");}catch(e){}if((p||s)==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl";}}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="langbtn" id="lang" type="button">العربية</button>
<div class="wrap">
<p class="crumb"><a href="index.html"><span data-en="United Arab Emirates" data-ar="الإمارات العربية المتحدة">United Arab Emirates</span></a> &rsaquo; <span data-en="Search" data-ar="بحث">Search</span></p>
<h1><span data-en="Search streets" data-ar="البحث في الشوارع">Search streets</span></h1>
<p class="lede"><span data-en="All 11,500+ named streets. Type in English or Arabic — search reads both, and ignores diacritics."
   data-ar="جميع الشوارع المسمّاة، أكثر من ١١٥٠٠. اكتب بالعربية أو الإنجليزية — البحث يقرأ اللغتين ويتجاهل التشكيل.">All 11,500+ named streets. Type in English or Arabic — search reads both, and ignores diacritics.</span></p>

<form class="searchbox" id="form" onsubmit="return false">
  <input id="q" type="search" autocomplete="off" spellcheck="false"
         data-placeholder-en="Al Wasl, شارع الوصل, Jumeirah…"
         data-placeholder-ar="الوصل، شارع الوصل، جميرا…"
         placeholder="Al Wasl, شارع الوصل, Jumeirah…"
         aria-label="Search streets" autofocus>
  <span class="count" id="stat"></span>
</form>

<ul class="list" id="hits"></ul>
<p class="note" id="empty" hidden><span data-en="No street matches that. Try fewer words, or an Arabic spelling."
   data-ar="لا يوجد شارع مطابق. جرّب كلمات أقل، أو كتابة عربية مختلفة.">No street matches that. Try fewer words, or an Arabic spelling.</span></p>

<footer>
  <span data-en="Street names and coordinates" data-ar="أسماء الشوارع والإحداثيات">Street names and coordinates</span>
  &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>,
  <span data-en="ODbL 1.0" data-ar="رخصة ODbL 1.0">ODbL 1.0</span>.
</footer>
</div>

<script src="search-index.js"></script>
<script>
(function () {
  var KEY = "directory-lang";
  var AREAS = window.SEARCH_AREAS || {};
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

  var rows = (window.SEARCH_INDEX || []).map(function (r) {
    var meta = AREAS[r[2]] || ["", "", "", "", ""];
    return {
      en: r[0], ar: r[1],
      districtEn: meta[1] || "", districtAr: meta[2] || "",
      emEn: meta[3] || "", emAr: meta[4] || "",
      url: meta[0] + "/" + r[2] + ".html",
      ne: norm(r[0]), na: norm(r[1]), ndEn: norm(meta[1]), ndAr: norm(meta[2])
    };
  });

  function norm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[\u064B-\u0655\u0670\u0640]/g, "")
      .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627")
      .replace(/\u0649/g, "\u064A")
      .replace(/\u0629/g, "\u0647")
      .replace(/[\u2019'\u02BC`]/g, "")
      .replace(/\s+/g, " ").trim();
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  var ar = function () { return document.documentElement.lang === "ar"; };

  var hits = document.getElementById("hits");
  var stat = document.getElementById("stat");
  var empty = document.getElementById("empty");
  var input = document.getElementById("q");

  function run(q) {
    var query = norm(q);
    var tokens = query ? query.split(" ").filter(Boolean) : [];
    if (!tokens.length) {
      hits.innerHTML = "";
      stat.textContent = rows.length.toLocaleString(ar() ? "ar-EG" : "en") + (ar() ? " شارع" : " streets");
      empty.hidden = true;
      return;
    }
    var found = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], score = 0, ok = true;
      for (var t = 0; t < tokens.length; t++) {
        var tok = tokens[t], s = 0;
        if (r.ne.indexOf(tok) === 0 || r.na.indexOf(tok) === 0) s = 3;
        else if (r.ne.indexOf(tok) > -1 || r.na.indexOf(tok) > -1) s = 2;
        else if (r.ndEn.indexOf(tok) > -1 || r.ndAr.indexOf(tok) > -1) s = 1;
        if (!s) { ok = false; break; }
        score += s;
      }
      if (ok) found.push({ r: r, score: score });
    }
    found.sort(function (a, b) { return b.score - a.score || a.r.en.localeCompare(b.r.en); });

    var top = found.slice(0, 80);
    var arabic = ar();
    hits.innerHTML = top.map(function (x) {
      var r = x.r;
      var district = arabic ? r.districtAr || r.districtEn : r.districtEn;
      var emirate = arabic ? r.emAr : r.emEn;
      var where = district || emirate;
      if (district && emirate) where = district + " · " + emirate;
      return '<li><a href="' + esc(r.url) + '">' +
        '<span>' + esc(r.en || r.ar) +
        (where ? '<br><small class="where">' + esc(where) + "</small>" : "") +
        '</span><span class="ar" lang="ar" dir="rtl">' + esc(r.ar || "") + "</span></a></li>";
    }).join("");

    var n = found.length, total = found.length.toLocaleString(arabic ? "ar-EG" : "en");
    if (!n) stat.textContent = "";
    else if (found.length > top.length) {
      stat.textContent = arabic
        ? "عرض " + top.length + " من " + total
        : "showing " + top.length + " of " + total;
    } else {
      stat.textContent = arabic ? total + " شارع" : total + (n === 1 ? " street" : " streets");
    }
    empty.hidden = n > 0;
  }

  function apply(l) {
    var isAr = l === "ar";
    document.documentElement.lang = isAr ? "ar" : "en";
    document.documentElement.dir = isAr ? "rtl" : "ltr";
    document.querySelectorAll("[data-en]").forEach(function (el) {
      var v = el.getAttribute(isAr ? "data-ar" : "data-en");
      if (v !== null) el.textContent = v;
    });
    document.querySelectorAll("[data-placeholder-en]").forEach(function (el) {
      el.placeholder = el.getAttribute(isAr ? "data-placeholder-ar" : "data-placeholder-en");
    });
    var t = document.documentElement.getAttribute(isAr ? "data-title-ar" : "data-title-en");
    if (t) document.title = t;
    document.getElementById("lang").textContent = isAr ? "English" : "العربية";
    try { localStorage.setItem(KEY, l); } catch (e) {}
  }

  document.getElementById("lang").addEventListener("click", function () {
    var next = ar() ? "en" : "ar";
    apply(next);
    run(input.value);
    var u = new URL(location.href);
    u.searchParams.set("lang", next);
    history.replaceState(null, "", u);
  });

  input.addEventListener("input", function () {
    run(input.value);
    var u = new URL(location.href);
    if (input.value) u.searchParams.set("q", input.value); else u.searchParams.delete("q");
    history.replaceState(null, "", u);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { input.value = ""; run(""); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });

  var params = new URLSearchParams(location.href);
  var initial = params.get("q") || "";
  var lang = params.get("lang") || stored() || (document.documentElement.lang === "ar" ? "ar" : "en");
  apply(lang);
  if (initial) input.value = initial;
  run(initial);
})();
</script>
</body>
</html>
